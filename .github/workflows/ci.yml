name: CI
on:
  push:
    branches: [trunk]
  # release: publish once the checks pass whatever changed. The weekly update
  # sets it when it moved something the tarballs are made of, its push having
  # started nothing.
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  contents: read
# bash -eo pipefail for every run step.
defaults:
  run:
    shell: bash
jobs:
  # The fast one: shellcheck and the unit and property tests, with mise's Zig.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # libopus is a submodule, compiled into the binary.
          submodules: recursive
      # The LFS objects themselves, keyed on the pointer files -- which are
      # content-addressed, so the key changes exactly when the libraries do.
      # `./run` pulls them if this misses, which costs one 24MB download.
      #
      # No restore-keys: a near-miss would hand this key the *previous*
      # object store, and saving it back would carry every superseded library
      # forward for as long as the chain is unbroken. That is how the cache
      # stayed at 184MB after the 368MB CUDA provider was deleted -- it was
      # still in there, being copied from key to key.
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('vendor/onnxruntime/lib/*.so') }}
      # zig, bun, shellcheck and cosign, at the versions mise.toml pins.
      - uses: jdx/mise-action@v5
      # Zig's global cache: the compiled standard library and the build's own
      # dependencies, which is most of a cold build.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: zig-linux-${{ hashFiles('build.zig.zon', 'mise.toml') }}
          restore-keys: zig-linux-
      - run: mise run check

  # The Linux tarball, built by mise as it is released, and installed into a
  # scratch home to verify its user units against the binary in it.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # run.ts versions the release by commit count.
          fetch-depth: 0
          submodules: recursive
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('vendor/onnxruntime/lib/*.so') }}
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: zig-linux-${{ hashFiles('build.zig.zon', 'mise.toml') }}
          restore-keys: zig-linux-
      - run: mise run dist
      - run: mise run dist-check
      - uses: actions/upload-artifact@v7
        with:
          name: capsper-linux-x86_64
          path: |
            dist/capsper-linux-x86_64.tar.gz
            dist/capsper-linux-x86_64.tar.gz.sha256

  # The macOS tarball, its tests run there too. On trunk the binary is signed
  # with a Fulcio certificate (the OIDC token) before it is packed.
  macos:
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # libopus is a submodule, compiled into the binary.
          submodules: recursive
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: ~/.cache/zig
          key: zig-macos-${{ hashFiles('build.zig.zon', 'mise.toml') }}
          restore-keys: zig-macos-
      - run: mise run check
      - run: mise run dist
      - name: Sign the binary
        if: github.ref == 'refs/heads/trunk'
        run: ./run sign
      - uses: actions/upload-artifact@v7
        with:
          name: capsper-macos-arm64
          path: |
            dist/capsper-macos-arm64.tar.gz
            dist/capsper-macos-arm64.tar.gz.sha256

  # NixOS support. There is no NixOS runner image, but a Nix derivation builds
  # identically on any host, so Nix on ubuntu is a real verification of the
  # package. The NixOS module needs an actual NixOS system, which the flake's
  # check boots in a VM — KVM is available on Linux runners and the installer
  # enables it. On trunk, capsper's own package goes to the danielbodart
  # cache, and nothing else: never the VM test's closure (the free tier is
  # 5 GB).
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only for bun, which runs run.ts. The flake supplies everything else.
      - uses: jdx/mise-action@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Upstream Nix rather than Determinate Nix, whose FlakeHub login
          # this repository has no account for: it fails after a 15s timeout
          # and warns. KVM is configured either way, and the VM test needs it.
          determinate: false
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true
      - name: Nix
        run: ./run nix
      - name: Push capsper's package to Cachix
        if: github.ref == 'refs/heads/trunk'
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [ -z "$CACHIX_AUTH_TOKEN" ]; then echo "No CACHIX_AUTH_TOKEN: nothing is pushed."; exit 0; fi
          nix build --no-link --print-out-paths .#capsper | cachix push danielbodart

  # A release, when a push to trunk that passed every channel's checks above
  # changed what the tarballs are made of: anything in mise.toml's
  # RELEASE_PATHS since the last release tag (`mise run release-due`). The
  # workflows, docs, flake.nix, flake.lock and nix/ alone release nothing. A
  # dispatch with `release` publishes whatever changed. The tarballs are the
  # ones the linux and macos jobs built and checked, gathered into dist/,
  # where `mise run sums` writes SHA256SUMS over both, each signed here with
  # cosign (keyless, a sigstore bundle beside it). The notes are the commits
  # since the last release.
  release:
    needs: [check, linux, macos, nix]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: jdx/mise-action@v5
      - name: Is a release due?
        id: due
        env:
          FORCE: ${{ inputs.release }}
        run: |
          if [ "$FORCE" = true ] || mise run release-due; then due=true; else due=false; fi
          echo "Release due: $due"
          echo "due=$due" >> "$GITHUB_OUTPUT"
      - if: steps.due.outputs.due == 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Sign and release
        if: steps.due.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(./run version)
          mise run sums
          assets=(dist/SHA256SUMS)
          for t in capsper-linux-x86_64.tar.gz capsper-macos-arm64.tar.gz; do
            (cd dist && sha256sum -c "$t.sha256")
            cosign sign-blob "dist/$t" --bundle "dist/$t.sigstore.json" --yes
            assets+=("dist/$t" "dist/$t.sha256" "dist/$t.sigstore.json")
          done
          # Trunk-based, no pull requests, so GitHub's PR-based notes would be
          # empty: the commits since the last release instead, or the head
          # commit when there is none.
          PREV="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -n "$PREV" ] && git rev-parse -q --verify "refs/tags/$PREV" >/dev/null; then
            git log "$PREV..HEAD" --pretty='- %s (%h)' > notes.md
          else
            { echo 'First automated release.'; echo; git log -1 --pretty='- %s (%h)'; } > notes.md
          fi
          gh release create "v$V" --title "v$V" --notes-file notes.md --target "$GITHUB_SHA" "${assets[@]}"
