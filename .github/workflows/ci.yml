name: CI
on:
  push:
    branches: [trunk]
permissions:
  contents: write
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs pkg-config pv ncat libpipewire-0.3-dev
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 0
      - name: CI
        id: ci
        run: ./run ci
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: capsper-linux-x86_64
          path: dist/
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ci.outputs.version }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          cp jfk.wav dist/
          tar -czf "capsper-linux-x86_64-${VERSION}.tar.gz" -C dist bin/ lib/ install.sh jfk.wav
          gh release create "v${VERSION}" "capsper-linux-x86_64-${VERSION}.tar.gz" \
            --title "v${VERSION}" \
            --notes "$COMMIT_MSG"
