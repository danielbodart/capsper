name: CI
on:
  push:
    branches: [trunk]
permissions:
  contents: write
  id-token: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config pv ncat libpipewire-0.3-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('dist/lib/*.so') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: actions/cache@v4
        with:
          path: tools
          key: mise-tools-linux-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-tools-linux-
      - uses: sigstore/cosign-installer@v3
      - name: CI
        run: ./run ci
        env:
          CI: "true"
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: capsper-linux-x86_64
          path: dist/

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-macos-${{ hashFiles('dist/lib-macos/*.dylib') }}
          restore-keys: lfs-macos-
      - run: git lfs pull
      - uses: actions/cache@v4
        with:
          path: tools
          key: mise-tools-macos-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-tools-macos-
      - uses: sigstore/cosign-installer@v3
      - name: Install rcodesign
        run: |
          curl -fsSL -o /tmp/apple-codesign.tar.gz \
            https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-macos-universal.tar.gz
          tar -xzf /tmp/apple-codesign.tar.gz -C /tmp
          sudo cp /tmp/apple-codesign-0.29.0-macos-universal/rcodesign /usr/local/bin/
      - name: CI
        run: ./run ci
        env:
          CI: "true"
          NO_CREATE_RELEASE: "true"
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: capsper-macos-arm64
          path: dist/
