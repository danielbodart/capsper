name: CI
on:
  push:
    branches: [trunk]
permissions:
  contents: write
  id-token: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpipewire-0.3-dev
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # libopus is a submodule, compiled into the binary.
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('dist/linux/lib/*.so') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: actions/cache@v4
        with:
          path: tools
          key: mise-tools-linux-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-tools-linux-
      - name: CI
        run: ./run ci
        env:
          CI: "true"
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: capsper-linux-x86_64
          path: dist/linux/

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # libopus is a submodule, compiled into the binary.
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: tools
          key: mise-tools-macos-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-tools-macos-
      - name: CI
        run: ./run ci
        env:
          CI: "true"
          NO_CREATE_RELEASE: "true"
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: capsper-macos-arm64
          path: dist/macos/

  # NixOS support. There is no NixOS runner image, but a Nix derivation builds
  # identically on any host, so Nix on ubuntu is a real verification of the
  # packages. The NixOS module needs an actual NixOS system, which the flake's
  # check boots in a VM — KVM is available on Linux runners and the Determinate
  # installer enables it.
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: tools
          key: mise-tools-linux-${{ hashFiles('.mise.toml') }}
          restore-keys: mise-tools-linux-
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Nix
        run: ./run nix
