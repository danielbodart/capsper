name: CI
on:
  push:
    branches: [trunk]
jobs:
  ci:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.0.0-devel-ubuntu22.04
    steps:
      - name: Install system deps
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates cmake pkg-config patchelf pv ncat libpipewire-0.3-dev
          git config --global safe.directory '*'
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: CI
        run: ./run ci
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: zigsper-linux-x86_64
          path: dist/
