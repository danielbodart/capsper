name: CI
on:
  push:
    branches: [trunk]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs pkg-config pv ncat libpipewire-0.3-dev
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: CI
        run: ./run ci
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: zigsper-linux-x86_64
          path: dist/
