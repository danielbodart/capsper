name: CI
on:
  push:
    branches: [trunk]
permissions:
  contents: write
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config pv ncat libpipewire-0.3-dev
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('dist/lib/*.so.*', 'dist/models/ten-vad-ggml.bin') }}
          restore-keys: lfs-
      - run: git lfs pull
      - uses: actions/cache@v4
        with:
          path: tools
          key: mise-tools-${{ hashFiles('.mise.toml') }}
      - name: CI
        run: ./run ci
        env:
          CI: "true"
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: capsper-linux-x86_64
          path: dist/
