# All of danielbodart's flakes move their locks in one window a week, Sunday
# 21:23 UTC, and the NixOS config that takes them follows two hours later, so
# they all land on the same nixos-26.05: a security fix reaches every machine
# within the week, a machine carries one nixpkgs rather than one per flake,
# and danielbodart.cachix.org already holds what the config asks for.
#
# The new lock is committed only if `./run nix` -- what CI's nix job runs,
# the flake check with its NixOS VM test and the package -- passes with it.
# Nothing is released for it: a release would be the same code under a new
# version, since what it ships is not built from the flake. The lock goes
# out with the next release a real change makes.
name: Bump the flake's inputs
on:
  schedule:
    - cron: "23 21 * * 0"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flake-lock
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Only for bun, which runs run.ts. The flake supplies everything else.
      - uses: jdx/mise-action@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
      # Pushes what the check builds. Without the secret it only substitutes.
      - uses: cachix/cachix-action@v17
        with:
          name: danielbodart
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Update the inputs
        id: update
        run: |
          nix flake update 2>&1 | tee update.log
          git diff --quiet flake.lock && { echo "Nothing moved."; exit 0; }
          moved=$(grep -oE "Updated input '[^']+'" update.log | cut -d"'" -f2 | paste -sd, - | sed 's/,/, /g')
          echo "moved=${moved:-flake.lock}" >>"$GITHUB_OUTPUT"
      - name: Check the flake with the new lock
        if: steps.update.outputs.moved
        run: ./run nix
      - name: Commit and push the lock
        if: steps.update.outputs.moved
        env:
          MOVED: ${{ steps.update.outputs.moved }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qm "Bump the flake's inputs: $MOVED" flake.lock
          git pull -q --rebase origin trunk
          git push -q origin HEAD:trunk
