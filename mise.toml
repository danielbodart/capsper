# The toolchain, pinned to the patch, for the release tarballs, CI's fast
# check and anyone working on this. The weekly update
# (.github/workflows/update.yml) moves each tool to the latest patch of its
# minor; a minor moves by hand, with zig_0_NN in nix/package.nix, so the
# tarballs and the Nix package are built by the same Zig.
[tools]
zig = "0.15.2"
bun = "1.3.10"
shellcheck = "0.11.0"

[tools.cosign]
version = "3.0.5"
os = ["macos", "linux"]

# Signs the macOS binary with a Fulcio certificate.
[tools."github:danielbodart/fulcio-codesign"]
version = "0.8.9"
os = ["macos"]

# What the release tarballs are made of. A change to any of these since the
# last release tag is released (see release-due); the workflows, docs,
# flake.nix, flake.lock and nix/ are not. vendor/libopus is a submodule,
# compiled into the binary.
[env]
RELEASE_PATHS = "build.zig build.zig.zon src dist models vendor .gitmodules run.ts mise.toml"

[tasks.check]
description = "shellcheck and the unit and property tests"
depends = ["lint", "test"]

[tasks.lint]
description = "shellcheck the installers and scripts"
run = "./run lint"

[tasks.test]
description = "The unit and property tests"
run = "./run test"

[tasks.build]
description = "capsper for this platform, into dist/linux or dist/macos"
run = "./run build"

[tasks.dist]
description = "This platform's release tarball and its .sha256"
run = "./run build && ./run dist"

[tasks.dist-check]
description = "The Linux tarball, as dist made it, installed into a scratch home, and its user units verified"
run = "scripts/dist-check.sh"

[tasks.release-due]
description = "Print true if anything in RELEASE_PATHS changed since the last release tag, else false"
run = '''
set -f
last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null) || { echo true; exit 0; }
if [ -n "$(git diff --name-only "$last" HEAD -- $RELEASE_PATHS)" ]; then echo true; else echo false; fi
'''
