# The toolchain, pinned to the patch, for the release tarballs, CI's fast
# check and anyone working on this. The weekly update
# (.github/workflows/update.yml) moves each tool to the latest patch of its
# minor; a minor moves by hand. The Nix package is the release tarball
# (flake.nix), so it is built by this Zig too.
[tools]
zig = "0.15.2"
bun = "1.3.14"
shellcheck = "0.11.0"

[tools.cosign]
version = "3.0.6"
os = ["macos", "linux"]

# Signs the macOS binary with a Fulcio certificate.
[tools."github:danielbodart/fulcio-codesign"]
version = "0.8.9"
os = ["macos"]

# What a release is made of. A change to any of these since the last
# release (see release-due) is released; the workflows, docs (the README the
# tarballs carry goes out with the next release), scripts/ and flake.lock (a
# consumer follows its own nixpkgs) are not. vendor/ is onnxruntime, linked,
# and the libopus submodule, compiled into the binary; packaging/ the
# scripts the tarballs carry; flake.nix and nix/ how a flake pinned to a
# release tag installs its tarball and runs it, which reaches nix-config only
# through a new tag. nix/release.json is never on trunk: a release adds it on
# its tag's own commit (ci.yml's release job).
[env]
RELEASE_PATHS = "build.zig build.zig.zon src packaging models vendor .gitmodules run.ts mise.toml flake.nix nix"

[tasks.check]
description = "shellcheck, the release scripts' tests, and the unit and property tests"
depends = ["lint", "scripts-test", "test"]

[tasks.lint]
description = "shellcheck the installers and scripts"
run = "./run lint"

[tasks.scripts-test]
description = "The release scripts' own tests"
run = "scripts/release-json-test.sh && scripts/last-release-test.sh"

[tasks.test]
description = "The unit and property tests"
run = "./run test"

[tasks.build]
description = "capsper for this platform, into dist/linux or dist/macos, with the scripts install.sh runs beside"
run = "./run build"

[tasks.dist]
description = "This platform's release tarball in dist/, its .sha256 and dist/SHA256SUMS"
run = "./run build && ./run dist"

[tasks.sums]
description = "dist/SHA256SUMS for every tarball in dist/ (CI's release job, once both platforms' are there)"
run = "./run sums"

[tasks.dist-check]
description = "The Linux tarball, as dist made it, installed into a scratch home, and its user units verified"
run = "scripts/dist-check.sh"

# `if mise run release-due; then ...`: CI's release job and the weekly
# update ask it, and nothing else knows RELEASE_PATHS.
[tasks.release-due]
description = "Print true and succeed if anything in RELEASE_PATHS changed since the last release, else print false and fail"
# The last release is the trunk commit its tag's commit is a child of, not
# an ancestor tag (scripts/last-release.sh): `git describe` finds no tag on
# trunk any more.
run = '''
set -f
last=$(scripts/last-release.sh) || { echo true; exit 0; }
last=${last#* }
if [ -n "$(git diff --name-only "$last" HEAD -- $RELEASE_PATHS)" ]; then echo true; else echo false; exit 1; fi
'''
