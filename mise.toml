# The toolchain, pinned to the patch, for the release tarballs, CI's fast
# check and anyone working on this. The weekly update
# (.github/workflows/update.yml) moves each tool to the latest patch of its
# minor; a minor moves by hand, with zig_0_NN in nix/package.nix, so the
# tarballs and the Nix package are built by the same Zig.
[tools]
zig = "0.15.2"
bun = "1.3.14"
shellcheck = "0.11.0"

[tools.cosign]
version = "3.0.6"
os = ["macos", "linux"]

# Signs the macOS binary with a Fulcio certificate.
[tools."github:danielbodart/fulcio-codesign"]
version = "0.8.9"
os = ["macos"]

# What the release tarballs are made of. A change to any of these since the
# last release tag is released (see release-due); the workflows, docs (the
# README the tarballs carry goes out with the next release), flake.nix,
# flake.lock and nix/ are not. vendor/ is onnxruntime, linked, and the
# libopus submodule, compiled into the binary; packaging/ the scripts the
# tarballs carry.
[env]
RELEASE_PATHS = "build.zig build.zig.zon src packaging models vendor .gitmodules run.ts mise.toml"

[tasks.check]
description = "shellcheck and the unit and property tests"
depends = ["lint", "test"]

[tasks.lint]
description = "shellcheck the installers and scripts"
run = "./run lint"

[tasks.test]
description = "The unit and property tests"
run = "./run test"

[tasks.build]
description = "capsper for this platform, into dist/linux or dist/macos, with the scripts install.sh runs beside"
run = "./run build"

[tasks.dist]
description = "This platform's release tarball in dist/, its .sha256 and dist/SHA256SUMS"
run = "./run build && ./run dist"

[tasks.sums]
description = "dist/SHA256SUMS for every tarball in dist/ (CI's release job, once both platforms' are there)"
run = "./run sums"

[tasks.dist-check]
description = "The Linux tarball, as dist made it, installed into a scratch home, and its user units verified"
run = "scripts/dist-check.sh"

# `if mise run release-due; then ...`: CI's release job and the weekly
# update ask it, and nothing else knows RELEASE_PATHS.
[tasks.release-due]
description = "Print true and succeed if anything in RELEASE_PATHS changed since the last release tag, else print false and fail"
run = '''
set -f
last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null) || { echo true; exit 0; }
if [ -n "$(git diff --name-only "$last" HEAD -- $RELEASE_PATHS)" ]; then echo true; else echo false; exit 1; fi
'''
