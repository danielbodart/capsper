[project]
name = "nemotron-coreml-convert"
version = "0.1.0"
description = "Convert Nemotron Speech 600M from NeMo/PyTorch to CoreML"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch>=2.7.0,<2.8",
    "nemo_toolkit[asr]>=2.1.0",
    "coremltools==9.0b1",
    "numpy",
    "soundfile",
]

[tool.uv]
override-dependencies = ["kaldialign>=0.9.3"]
